name: PayFlow CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Run .NET Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore PayFlow.slnx

      - name: Build Solution
        run: dotnet build PayFlow.slnx --no-restore -c Release

      - name: Execute Tests
        run: dotnet test PayFlow.slnx --no-build -c Release --verbosity normal

  frontend-build:
    name: Build Frontend (Vite & React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/payflow-web/package-lock.json

      - name: Install Dependencies
        working-directory: frontend/payflow-web
        run: npm ci

      - name: Build Web Client
        working-directory: frontend/payflow-web
        run: npm run build
