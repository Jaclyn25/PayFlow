name: PayFlow CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-and-test:
    name: Build & Run .NET Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore PayFlow.slnx

      - name: Build Solution
        run: dotnet build PayFlow.slnx --no-restore -c Release

      - name: Execute Tests with Code Coverage
        run: dotnet test PayFlow.slnx --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Generate Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: TestResults/**/coverage.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Add Coverage to Step Summary
        if: always()
        run: |
          if [ -f code-coverage-results.md ]; then
            cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Upload Test and Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-and-coverage-results
          path: |
            TestResults/**/coverage.cobertura.xml
            code-coverage-results.md
          retention-days: 14

  frontend-build:
    name: Build & Test Frontend (Vite & React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/payflow-web/package-lock.json

      - name: Install Dependencies
        working-directory: frontend/payflow-web
        run: npm ci

      - name: Run Unit Tests
        working-directory: frontend/payflow-web
        run: npm test

      - name: Build Web Client
        working-directory: frontend/payflow-web
        run: npm run build
