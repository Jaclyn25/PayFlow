apiVersion: v1
kind: Secret
metadata:
  name: {{ include "payflow.fullname" . }}-secrets
  labels:
    {{- include "payflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: {{ .Values.secrets.defaultConnection | quote }}
  RabbitMQ__Password: {{ .Values.secrets.rabbitMqPassword | quote }}
  Jwt__SecretKey: {{ .Values.secrets.jwtSecretKey | quote }}
