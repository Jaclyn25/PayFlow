apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payflow-api-ingress
  namespace: payflow
  labels:
    app.kubernetes.io/name: payflow-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: payflow-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "payflow-api"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.payflow.example.com
      secretName: payflow-tls-cert
  rules:
    - host: api.payflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payflow-api
                port:
                  number: 80
