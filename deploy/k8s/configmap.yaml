apiVersion: v1
kind: ConfigMap
metadata:
  name: payflow-api-config
  namespace: payflow
  labels:
    app.kubernetes.io/name: payflow-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: payflow-platform
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  Serilog__MinimumLevel: "Information"
  RabbitMQ__HostName: "rabbitmq.payflow.svc.cluster.local"
  RabbitMQ__Port: "5672"
  RabbitMQ__UserName: "guest"
  ConnectionStrings__Redis: "redis.payflow.svc.cluster.local:6379"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.payflow.svc.cluster.local:4317"
  Cors__AllowedOrigins__0: "https://payflow.example.com"
  Jwt__Issuer: "PayFlow.Api"
  Jwt__Audience: "PayFlow.Client"
